# Fidelity Investments - Conceptual GraphQL Schema
# Derived from public product documentation, Fidelity Institutional / Wealthscape,
# NetBenefits retirement platform, and standard financial services domain models.
# Fidelity does not operate a public developer API; this is a conceptual representation.

# -------------------------
# Enums
# -------------------------

enum AccountType {
  INDIVIDUAL
  JOINT
  TRUST
  IRA_TRADITIONAL
  IRA_ROTH
  IRA_SEP
  IRA_SIMPLE
  PLAN_401K
  PLAN_403B
  PLAN_457B
  PLAN_529
  HSA
  BROKERAGE
  NET_BENEFITS
  CD
  ANNUITY
}

enum OrderType {
  MARKET
  LIMIT
  STOP
  STOP_LIMIT
  TRAILING_STOP
}

enum OrderSide {
  BUY
  SELL
  BUY_TO_OPEN
  BUY_TO_CLOSE
  SELL_TO_OPEN
  SELL_TO_CLOSE
}

enum OrderStatus {
  PENDING
  OPEN
  PARTIALLY_FILLED
  FILLED
  CANCELED
  REJECTED
  EXPIRED
}

enum OrderDuration {
  DAY
  GTC
  EXT
  GTC_EXT
  AT_OPEN
  AT_CLOSE
}

enum AssetClass {
  EQUITY
  FIXED_INCOME
  MUTUAL_FUND
  ETF
  OPTION
  CD
  ANNUITY
  CASH
  ALTERNATIVE
}

enum OptionType {
  CALL
  PUT
}

enum InvestmentStyle {
  GROWTH
  VALUE
  BLEND
  INCOME
}

enum RatingValue {
  STRONG_BUY
  BUY
  HOLD
  SELL
  STRONG_SELL
}

enum AlertType {
  PRICE_ABOVE
  PRICE_BELOW
  PERCENT_CHANGE
  VOLUME
  NEWS
  EARNINGS
  DIVIDEND
  ANALYST_RATING
}

enum DocumentType {
  STATEMENT
  CONFIRMATION
  TAX_1099_DIV
  TAX_1099_B
  TAX_1099_INT
  TAX_1099_R
  TAX_5498
  COST_BASIS
  PLAN_SUMMARY
  ANNUAL_REPORT
}

enum TaxTreatment {
  TAXABLE
  TAX_DEFERRED
  TAX_EXEMPT
  ROTH
}

# -------------------------
# Scalars
# -------------------------

scalar Date
scalar DateTime
scalar Decimal
scalar JSON

# -------------------------
# Auth
# -------------------------

type Auth {
  token: Token
  expiresAt: DateTime
  scopes: [String!]!
}

type Token {
  accessToken: String!
