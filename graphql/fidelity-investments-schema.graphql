# -------------------------
# Root Types
# -------------------------

type Query {
  # Auth
  me: Customer

  # Accounts
  account(accountId: ID!): Account
  accounts(customerId: ID!): [Account!]!
  accountBalance(accountId: ID!): AccountBalance

  # Positions
  positions(accountId: ID!): Positions
  holding(holdingId: ID!): Holding

  # Quotes and Market Data
  quote(symbol: String!): Quote
  quotes(symbols: [String!]!): [Quote!]!
  historicalData(symbol: String!, period: String!, interval: String!): HistoricalData
  marketData: MarketData
  optionChain(symbol: String!, expiration: Date): OptionChain

  # Corporate Actions
  dividendHistory(symbol: String!): DividendHistory
  splitHistory(symbol: String!): SplitHistory
  earnings(symbol: String!, periods: Int): [Earning!]!

  # Orders and Transactions
  order(orderId: ID!): TradeOrder
  orders(accountId: ID!, status: OrderStatus): [TradeOrder!]!
  transactions(accountId: ID!, startDate: Date, endDate: Date): [Transaction!]!

  # Documents
  statements(accountId: ID!): [Statement!]!
  confirmations(accountId: ID!): [ConfirmationSlip!]!
  taxDocuments(accountId: ID!, taxYear: Int): [TaxDocument!]!
  costBasisReport(accountId: ID!, symbol: String!): CostBasisReport

  # Research and News
  research(symbol: String!): [Research!]!
  news(symbols: [String!], limit: Int): [NewsArticle!]!
  ratings(symbol: String!): [Rating!]!

  # Portfolio
  portfolioAnalysis(accountId: ID!): PortfolioAnalysis

  # Alerts and Watchlists
  alerts(customerId: ID!): [Alert!]!
  watchLists(customerId: ID!): [WatchList!]!
  watchList(watchListId: ID!): WatchList
}

type Mutation {
  # Auth
  authenticate(username: String!, password: String!): Auth
  refreshToken(refreshToken: String!): Token

  # Orders
  placeMarketOrder(accountId: ID!, symbol: String!, side: OrderSide!, quantity: Decimal!): MarketOrder
  placeLimitOrder(accountId: ID!, symbol: String!, side: OrderSide!, quantity: Decimal!, limitPrice: Decimal!, duration: OrderDuration!): LimitOrder
  placeStopOrder(accountId: ID!, symbol: String!, side: OrderSide!, quantity: Decimal!, stopPrice: Decimal!, duration: OrderDuration!): StopOrder
  placeStopLimitOrder(accountId: ID!, symbol: String!, side: OrderSide!, quantity: Decimal!, stopPrice: Decimal!, limitPrice: Decimal!, duration: OrderDuration!): StopLimitOrder
  cancelOrder(orderId: ID!): TradeOrder

  # Alerts
  createAlert(customerId: ID!, symbol: String, alertType: AlertType!, condition: String!, threshold: Decimal): Alert
  deleteAlert(alertId: ID!): Boolean!

  # Watchlists
  createWatchList(customerId: ID!, name: String!): WatchList
  addToWatchList(watchListId: ID!, symbol: String!): WatchListItem
  removeFromWatchList(watchListId: ID!, itemId: ID!): Boolean!
  deleteWatchList(watchListId: ID!): Boolean!

  # Webhooks
  createWebhook(customerId: ID!, url: String!, events: [String!]!): Webhook
  deleteWebhook(webhookId: ID!): Boolean!
}

type Subscription {
  quoteUpdated(symbol: String!): Quote
  orderStatusChanged(orderId: ID!): TradeOrder
  alertTriggered(customerId: ID!): Alert
  portfolioValueChanged(accountId: ID!): AccountBalance
}
